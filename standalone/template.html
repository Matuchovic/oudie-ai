<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Oudie</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oudie">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<style>
  :root {
    --bg-top: #141a26;
    --bg-bot: #05070c;
    --cyan: #35c6ff;
    --cyan-dim: #1d7fa8;
    --amber: #ffb02e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(178deg, var(--bg-top) 0%, #0a0e18 42%, var(--bg-bot) 100%);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    color: #cfe9f7;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; }
  /* Constellation sits above the canvas; the humanoid fades under it. */
  #sky { position: fixed; inset: 0; z-index: 2; }
  #bar, #status, #diag, #hint { z-index: 5; }
  #stage { transition: opacity .4s ease; }
  #stage.dim { opacity: 0; }

  /* Measured off the reference: the scene blooms into a blue radial flash
     for ~200ms, then cuts. The swap happens at the peak, so the eye never
     sees either view fade — it sees a burst and something new behind it. */
  #flash {
    position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 46%,
      rgba(120,205,255,.95) 0%, rgba(38,120,210,.55) 34%, rgba(0,0,0,0) 68%);
  }
  #flash.go { animation: flash-burst .62s ease-out; }
  @keyframes flash-burst {
    0%   { opacity: 0; transform: scale(.55); }
    32%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.4); }
  }
  @media (prefers-reduced-motion: reduce) { #flash.go { animation: none; } }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }

  /* Status readout. In the reference this sits mid-right, small,
     letter-spaced, and never moves. */
  #status {
    position: fixed;
    right: clamp(16px, 6vw, 92px);
    top: 50%;
    transform: translateY(-50%);
    font-size: clamp(9px, 1.55vw, 12px);
    letter-spacing: 0.22em;
    color: var(--cyan);
    text-shadow: 0 0 12px rgba(53,198,255,.75);
    white-space: nowrap;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }

  #bar {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: max(20px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 6px;
    padding: 6px;
    max-width: calc(100vw - 16px);
    overflow-x: auto;
    scrollbar-width: none;
    border-radius: 999px;
    background: rgba(10,16,28,.82);
    border: 1px solid rgba(53,198,255,.16);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  #bar::-webkit-scrollbar { display: none; }
  button {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: #7fa6bd;
    font: inherit;
    font-size: clamp(10px, 1.5vw, 12px);
    letter-spacing: .12em;
    white-space: nowrap;
    padding: 9px 15px;
    border-radius: 999px;
    cursor: pointer;
    transition: color .18s, background .18s, border-color .18s;
  }
  button:hover { color: #d6f2ff; }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  button[aria-pressed="true"] {
    color: var(--amber);
    border-color: rgba(255,176,46,.5);
    background: rgba(255,176,46,.09);
  }
  #diag {
    position: fixed; top: 12px; left: 14px;
    font-size: 11px; line-height: 1.6;
    color: rgba(160,200,225,.75);
    pointer-events: none; font-variant-numeric: tabular-nums;
    white-space: pre-wrap; max-width: 46ch;
  }
  #hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(max(20px, env(safe-area-inset-bottom)) + 52px);
    font-size: 10px; letter-spacing: .18em; color: rgba(127,166,189,.5);
    pointer-events: none;
  }
  @media (max-width: 700px) {
    #bar { gap: 2px; padding: 5px; }
    button { min-height: 44px; padding: 11px 14px; font-size: 12px; letter-spacing: .05em; }
    #diag, #hint { display: none; }
    #status { right: 12px; font-size: 10px; letter-spacing: .16em; }
  }
  @media (prefers-reduced-motion: reduce) { #hint { display: none; } }
</style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="sky"></div>
  <div id="flash"></div>
  <div id="status">ASSEMBLING… 0%</div>
  <div id="diag"></div>
  <div id="hint">drag to orbit</div>
  <div id="bar">
    <button id="b-view">TÝM</button>
    <button id="b-lang">EN</button>
    <button id="b-replay">REPLAY</button>
    <button id="b-listen" aria-pressed="true">LISTENING</button>
    <button id="b-speak" aria-pressed="false">SPEAKING</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*__BUNDLE__*/

(function () {
  var canvas = document.getElementById('c');
  var status = document.getElementById('status');
  var bListen = document.getElementById('b-listen');
  var bSpeak = document.getElementById('b-speak');

  var api = createHumanoid(THREE, canvas, {
    onStatus: function (s) { status.textContent = s.label; },
    forceLDR: new URLSearchParams(location.search).has('ldr')
  });

  function sync() {
    var s = api.getState();
    bListen.setAttribute('aria-pressed', String(s === 'listening'));
    bSpeak.setAttribute('aria-pressed', String(s === 'speaking'));
  }

  document.getElementById('b-replay').onclick = function () { api.replay(); sync(); };
  bListen.onclick = function () { api.setState('listening'); sync(); };
  bSpeak.onclick = function () { api.setState('speaking'); sync(); };
  window.__api = api;

  var i18n = createI18n('cs');

  // Gate first. With no adapter configured this shows the panel and says so
  // rather than pretending anyone is signed in.
  // The standalone file is a design preview with no backend to sign in to,
  // so the gate only appears on request. The app itself always gates.
  var login = createLogin({ i18n: i18n, logoSrc: 'logo.png', previewSkip: true, onSignedIn: function () {} });
  login.gate();
  window.__login = login;

  var sky = createConstellation(document.getElementById('sky'), {
    i18n: i18n,
    onSelect: function (a) { console.log('agent', a.id); }
  });

  var view = 'team';
  var bView = document.getElementById('b-view');
  var bLang = document.getElementById('b-lang');

  function applyView() {
    var team = view === 'team';
    document.getElementById('stage').classList.toggle('dim', team);
    if (team) sky.show(); else sky.hide();
    bView.textContent = team ? i18n.t.showFace : i18n.t.showTeam;
    status.style.opacity = team ? 0 : 1;
  }
  var flash = document.getElementById('flash');
  var swapping = false;
  bView.onclick = function () {
    if (swapping) return;
    swapping = true;
    flash.classList.remove('go');
    void flash.offsetWidth;          // restart the animation
    flash.classList.add('go');
    setTimeout(function () {         // swap at the peak of the burst
      view = view === 'team' ? 'face' : 'team';
      if (view === 'face') {
        api.setPaused(false);
        api.replay();
        // Requested inside the click handler so the gesture still counts.
        // Refusal is fine: the figure just stops reacting.
        api.startTracking();
        api.enableMic();
      } else {
        api.stopTracking();
        api.setPaused(true);
      }
      applyView();
    }, 200);
    setTimeout(function () { swapping = false; }, 640);
  };
  bLang.onclick = function () {
    i18n.toggle();
    bLang.textContent = i18n.lang === 'cs' ? 'EN' : 'CS';
    applyView();
  };
  i18n.onChange(applyView);
  applyView();

  var diagEl = document.getElementById('diag');
  setInterval(function () {
    var d = api.diagnostics();
    diagEl.textContent =
      'WebGL ' + d.webgl + ' · HDR bloom ' + (d.hdrBloom ? 'yes' : 'no') + '\n' +
      'canvas ' + d.canvas + ' @ ' + d.dpr + 'x\n' +
      'uScale ' + d.uScale + ' · point ' + d.pointPx + 'px\n' +
      d.points + ' points · ' + d.drawCalls + ' draws\n' +
      d.fps + ' fps' + (d.safeMode ? ' · safe mode' : '') +
      (d.shaderErrors.length ? '\n\nSHADER: ' + d.shaderErrors[0] : '');
  }, 500);

})();
</script>
</body>
</html>
